<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ===== Tokens ===== */
:root {
  --charcoal: #0E0E10;
  --charcoal-2: #1B1B1E;
  --porcelain: #F7F6F2;
  --panel: #FFFFFF;
  --enamel: #171717;
  --enamel-light: #2B2B2E;
  --brass: #B8922B;
  --brass-light: #D8B653;
  --graphite: #202022;
  --muted: #6F6D64;
  --sage: #171717;
  --rust: #6F6D64;
  --border: #E6E2D6;
  --radius-sm: 4px;
  --radius-md: 8px;
  --font-display: 'Vazirmatn', sans-serif;
  --font-body: 'Vazirmatn', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-card: 0 1px 2px rgba(14,14,16,0.06), 0 4px 12px rgba(14,14,16,0.05);
  --shadow-lift: 0 10px 28px rgba(14,14,16,0.16);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--porcelain);
  color: var(--graphite);
  line-height: 1.6;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
button, select, input { font-family: inherit; }

.skip-link {
  position: absolute; right: -9999px; top: 0; background: var(--brass); color: #fff;
  padding: 10px 16px; z-index: 200; border-radius: var(--radius-sm);
}
.skip-link:focus { right: 12px; top: 12px; }

/* ===== Topbar ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--charcoal);
  border-bottom: 3px solid var(--brass);
}
.topbar-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; gap: 20px;
  padding: 12px 20px;
}
.brand { display: flex; align-items: center; gap: 8px; color: #fff; flex-shrink: 0; }
.brand-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  background: var(--brass); color: var(--charcoal); font-weight: 800; font-size: 18px;
}
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: 0.3px; }

.search-wrap { flex: 1; }
#searchInput {
  width: 100%; padding: 10px 14px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: #363B43; color: #fff; font-size: 0.95rem;
  transition: background 0.15s, box-shadow 0.15s;
}
#searchInput::placeholder { color: #9AA0A6; }
#searchInput:focus { outline: none; background: #3F454E; box-shadow: 0 0 0 2px var(--brass-light); }

.cart-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--brass); color: var(--charcoal); border: none;
  padding: 10px 16px; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer;
  flex-shrink: 0; transition: background 0.15s, transform 0.1s;
}
.cart-btn:hover { background: var(--brass-light); }
.cart-btn:active { transform: scale(0.97); }
.cart-count {
  background: var(--charcoal); color: #fff; border-radius: 999px;
  min-width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-family: var(--font-mono); padding: 0 5px;
}

/* ===== Nameplate hero ===== */
.nameplate {
  max-width: 1200px; margin: 32px auto 0; padding: 0 20px;
}
.nameplate-panel {
  background: linear-gradient(155deg, var(--charcoal) 0%, var(--charcoal-2) 100%);
  border: 1px solid #40454D;
  border-inline-start: 6px solid var(--brass);
  border-radius: var(--radius-md);
  padding: 32px clamp(20px, 4vw, 44px);
  color: #F2F0EA;
  position: relative;
  overflow: hidden;
}
.nameplate-panel::before {
  content: "";
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 14px);
  pointer-events: none;
}
.nameplate-row.nameplate-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.nameplate-eyebrow {
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 2px;
  color: var(--brass-light); border: 1px solid var(--brass); border-radius: 3px; padding: 2px 7px;
}
.nameplate-title h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; }
.nameplate-tagline { max-width: 46em; color: #C9CCD1; margin: 0 0 22px; font-size: 1.02rem; }

.nameplate-specs {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px 24px; margin: 0 0 18px; padding: 18px 0 0; border-top: 1px dashed #454A52;
}
.nameplate-specs dt {
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 1.5px; color: #9AA0A6;
}
.nameplate-specs dd {
  margin: 3px 0 0; font-family: var(--font-mono); font-size: 0.92rem; font-weight: 500; color: #F2F0EA;
}
.nameplate-note { font-size: 0.85rem; color: #9AA0A6; margin: 0; }

/* ===== Controls ===== */
.controls {
  max-width: 1200px; margin: 26px auto 0; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.chips {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: thin;
}
.chip {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--panel);
  color: var(--graphite); padding: 7px 16px; border-radius: 999px; font-size: 0.86rem;
  cursor: pointer; transition: all 0.15s; font-weight: 500;
}
.chip:hover { border-color: var(--enamel); color: var(--enamel); }
.chip[aria-selected="true"] {
  background: var(--enamel); border-color: var(--enamel); color: #fff;
}
.sort-wrap { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; color: var(--muted); flex-shrink: 0; }
#sortSelect {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; background: var(--panel); color: var(--graphite);
}

.results-meta {
  max-width: 1200px; margin: 16px auto 0; padding: 0 20px;
  font-size: 0.85rem; color: var(--muted); font-family: var(--font-mono);
}

/* ===== Grid & cards ===== */
.grid {
  max-width: 1200px; margin: 12px auto 40px; padding: 0 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px;
}
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-md);
  overflow: hidden; display: flex; flex-direction: column;
  transition: box-shadow 0.18s, transform 0.18s;
}
.card:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }

.card-visual {
  aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center;
  position: relative; cursor: pointer;
}
.card-visual svg { width: 46%; height: 46%; }
.card-visual .stock-tag {
  position: absolute; top: 10px; inset-inline-start: 10px;
  font-size: 0.68rem; font-family: var(--font-mono); padding: 3px 8px; border-radius: 3px;
  background: rgba(255,255,255,0.9); color: var(--sage); font-weight: 700;
}
.card-visual .stock-tag.out { color: var(--rust); }

.card-body { padding: 14px 14px 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.card-cat { font-size: 0.72rem; color: var(--muted); }
.card-name {
  font-size: 0.94rem; font-weight: 600; color: var(--charcoal); margin: 0;
  cursor: pointer; line-height: 1.4;
}
.card-name:hover { color: var(--enamel); }
.card-rating { font-size: 0.78rem; color: var(--brass); font-family: var(--font-mono); }
.card-price { font-size: 1.05rem; font-weight: 800; color: var(--charcoal); margin-top: 2px; }
.card-price small { font-size: 0.72rem; font-weight: 500; color: var(--muted); }

.card-plate {
  margin-top: 10px; padding: 9px 14px; background: var(--porcelain);
  border-top: 1px dashed var(--border);
  display: flex; justify-content: space-between; gap: 6px;
  font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted);
}

.card-actions { padding: 12px 14px 14px; }
.add-btn {
  width: 100%; padding: 9px; border-radius: var(--radius-sm); border: 1px solid var(--enamel);
  background: transparent; color: var(--enamel); font-weight: 700; cursor: pointer; font-size: 0.86rem;
  transition: background 0.15s, color 0.15s;
}
.add-btn:hover { background: var(--enamel); color: #fff; }
.add-btn:disabled {
  border-color: var(--border); color: var(--muted); cursor: not-allowed; background: var(--porcelain);
}

.empty-state {
  max-width: 1200px; margin: 40px auto; padding: 0 20px; text-align: center; color: var(--muted);
}

/* ===== Footer ===== */
.site-footer {
  border-top: 1px solid var(--border); padding: 22px 20px; text-align: center;
  color: var(--muted); font-size: 0.82rem; background: var(--panel);
}

/* ===== Cart drawer ===== */
.cart-overlay, .modal-overlay {
  position: fixed; inset: 0; background: rgba(35,38,43,0.45); z-index: 90;
}
.cart-drawer {
  position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(380px, 92vw);
  background: var(--panel); z-index: 91; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lift);
  animation: slideIn 0.2s ease-out;
}
@keyframes slideIn { from { transform: translateX(var(--slide-from, -100%)); } to { transform: translateX(0); } }
html[dir="rtl"] .cart-drawer { --slide-from: 100%; }

.cart-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--border);
}
.icon-btn {
  background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--muted);
  width: 32px; height: 32px; border-radius: var(--radius-sm);
}
.icon-btn:hover { background: var(--porcelain); color: var(--graphite); }

.cart-items { flex: 1; overflow-y: auto; padding: 12px 18px; }
.cart-item {
  display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border);
  align-items: center;
}
.cart-item-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--porcelain); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cart-item-icon svg { width: 60%; height: 60%; }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 0.84rem; font-weight: 600; color: var(--charcoal); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-item-price { font-size: 0.78rem; color: var(--muted); font-family: var(--font-mono); }
.qty-controls { display: flex; align-items: center; gap: 6px; }
.qty-controls button {
  width: 24px; height: 24px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--panel); cursor: pointer; font-family: var(--font-mono);
}
.qty-controls span { font-family: var(--font-mono); min-width: 18px; text-align: center; font-size: 0.85rem; }
.cart-empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 0.9rem; }

.cart-footer { padding: 16px 18px; border-top: 1px solid var(--border); }
.cart-total-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 12px; }
#cartTotal { font-family: var(--font-mono); color: var(--brass); }
.checkout-btn {
  width: 100%; padding: 12px; border-radius: var(--radius-sm); border: none;
  background: var(--border); color: var(--muted); font-weight: 700; cursor: not-allowed; font-size: 0.92rem;
}
.cart-disclaimer { font-size: 0.72rem; color: var(--muted); text-align: center; margin: 8px 0 0; }

/* ===== Product modal ===== */
.product-modal {
  position: fixed; top: 50%; inset-inline-start: 50%; transform: translate(-50%, -50%);
  background: var(--panel); z-index: 91; border-radius: var(--radius-md);
  width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
  box-shadow: var(--shadow-lift);
}
html[dir="rtl"] .product-modal { transform: translate(50%, -50%); }
.modal-close { position: absolute; top: 12px; inset-inline-end: 12px; z-index: 2; }
.modal-visual {
  aspect-ratio: 16/9; background: var(--porcelain); display: flex; align-items: center; justify-content: center;
}
.modal-visual svg { width: 34%; height: 34%; }
.modal-content { padding: 24px; }
.modal-content h2 { font-size: 1.2rem; margin-bottom: 4px; }
.modal-cat { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
.modal-price { font-size: 1.5rem; font-weight: 800; margin-bottom: 16px; }
.modal-specs {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px;
  background: var(--porcelain); border: 1px dashed var(--border); border-radius: var(--radius-sm);
  padding: 14px; margin-bottom: 18px;
}
.modal-specs dt { font-family: var(--font-mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; }
.modal-specs dd { margin: 2px 0 0; font-family: var(--font-mono); font-size: 0.88rem; }

@media (max-width: 640px) {
  .topbar-inner { flex-wrap: wrap; }
  .brand { order: 1; }
  .cart-btn { order: 2; margin-inline-start: auto; }
  .search-wrap { order: 3; flex-basis: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

<a class="skip-link" href="#main">رفتن به محتوای اصلی</a>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">

    </div>
    <button id="cartBtn" class="cart-btn" aria-haspopup="dialog" aria-controls="cartDrawer">
      <span aria-hidden="true">🛒</span>
      <span>سبد</span>
      <span id="cartCount" class="cart-count">0</span>
    </button>
  </div>
</header>

<main id="main">

  <section class="nameplate" aria-label="معرفی فروشگاه">
    <div class="nameplate-panel">
      <div class="nameplate-row nameplate-title">
        <span class="nameplate-eyebrow">MODEL</span>
        <h1>خانه‌کالا</h1>
      </div>
      <p class="nameplate-tagline">بهترین لوازم خانگی با کیفیت برتر و قیمت مناسب</p>
      <dl class="nameplate-specs">

        <div><dt>CATALOG</dt><dd id="specCount">132 ITEMS</dd></div>
        <div><dt>VOLTAGE</dt><dd>220V ~ 50Hz</dd></div>
        <div><dt>WARRANTY</dt><dd>12-36 MONTHS</dd></div>
      </dl>
    </div>
  </section>

  <section class="controls" aria-label="فیلتر و مرتب‌سازی">
    <div id="categoryChips" class="chips" role="tablist" aria-label="دسته‌بندی‌ها"></div>
    <div class="sort-wrap">
      <label for="sortSelect">مرتب‌سازی</label>
      <select id="sortSelect">
        <option value="default">پیش‌فرض</option>
        <option value="price-asc">قیمت: کم به زیاد</option>
        <option value="price-desc">قیمت: زیاد به کم</option>
        <option value="rating-desc">بیشترین امتیاز</option>
      </select>
    </div>
  </section>

  <p id="resultsMeta" class="results-meta" role="status"></p>
  <section id="productGrid" class="grid" aria-label="محصولات"></section>
  <p id="emptyState" class="empty-state" hidden>چیزی پیدا نشد.</p>

</main>

<footer class="site-footer">
  <p>خانه‌کالا — فروشگاه اینترنتی لوازم خانگی</p>
</footer>

<div id="cartOverlay" class="cart-overlay" hidden></div>
<aside id="cartDrawer" class="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
  <div class="cart-header">
    <h2 id="cartTitle">سبد خرید</h2>
    <button id="cartClose" class="icon-btn" aria-label="بستن سبد خرید">✕</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total-row">
      <span>جمع کل</span>
      <span id="cartTotal">۰ تومان</span>
    </div>
    <button id="checkoutBtn" class="checkout-btn" disabled>ثبت سفارش</button>
  </div>
</aside>

<div id="modalOverlay" class="modal-overlay" hidden></div>
<div id="productModal" class="product-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <button id="modalClose" class="icon-btn modal-close" aria-label="بستن">✕</button>
  <div id="modalBody"></div>
</div>

    card.innerHTML = `
      <div class="card-visual" style="background:${swatchFor(p.category)}" data-open="${p.id}">
        <span class="stock-tag ${p.inStock ? '' : 'out'}">${p.inStock ? 'موجود' : 'ناموجود'}</span>
        <span style="color:${iconColorFor(p.category)}">${iconFor(p.icon)}</span>
      </div>
      <div class="card-body">
        <div class="card-cat">${p.categoryLabel}</div>
        <h3 class="card-name" data-open="${p.id}">${p.name}</h3>
        <div class="card-rating">★ ${p.rating.toLocaleString('fa-IR')}</div>
        <div class="card-price">${fmtToman(p.price)}</div>
      </div>
      <div class="card-plate">
        <span>مدل ${p.model}</span>
        <span>${p.power != null ? p.power.toLocaleString('fa-IR') + 'W' : p.material}</span>
        <span>${p.warranty.toLocaleString('fa-IR')} ماه گارانتی</span>
      </div>
      <div class="card-actions">
        <button class="add-btn" data-add="${p.id}" ${p.inStock ? '' : 'disabled'}>
          ${p.inStock ? 'افزودن به سبد' : 'ناموجود'}
        </button>
      </div>
    `;
    card.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openModal(p.id)));
    const addBtn = card.querySelector('[data-add]');
    if (addBtn) addBtn.addEventListener('click', () => addToCart(p.id));
    return card;
  }

  /* Monochrome black / white / gold swatch scale — alternates a pale-gold tint
     with a neutral off-white so the grid still reads as distinct categories
     without introducing any hue outside the theme. */
  function swatchFor(cat) {
    const map = {
      fridge: '#F7F1DE', washer: '#F4F4F1', dishwasher: '#F8F0D9', stove: '#F1F1EE',
      microwave: '#F7F1DE', vacuum: '#F4F4F1', fan: '#F8F0D9', iron: '#F1F1EE',
      kitchen: '#F7F1DE', tv: '#F4F4F1', cookware: '#F8F0D9',
    };
    return map[cat] || '#F4F4F1';
  }
  function iconColorFor(cat) {
    // Every other category rendered in gold instead of ink, purely for scan-ability.
    const goldSet = new Set(['fridge', 'stove', 'kitchen', 'fan', 'cookware']);
    return goldSet.has(cat) ? '#B8922B' : '#171717';
  }

  /* ---------- Cart ---------- */
  const cartBtn = document.getElementById('cartBtn');
  const cartDrawer = document.getElementById('cartDrawer');
  const cartOverlay = document.getElementById('cartOverlay');
  const cartClose = document.getElementById('cartClose');
  const cartItemsEl = document.getElementById('cartItems');
  const cartTotalEl = document.getElementById('cartTotal');
  const cartCountEl = document.getElementById('cartCount');

  function addToCart(id) {
    state.cart[id] = (state.cart[id] || 0) + 1;
    saveCart();
    renderCart();
    openCart();
  }
  function changeQty(id, delta) {
    const next = (state.cart[id] || 0) + delta;
    if (next <= 0) delete state.cart[id];
    else state.cart[id] = next;
    saveCart();
    renderCart();
  }
  function cartCount() {
    return Object.values(state.cart).reduce((a, b) => a + b, 0);
  }
  function renderCart() {
    const ids = Object.keys(state.cart);
    cartCountEl.textContent = cartCount().toLocaleString('fa-IR');
    if (ids.length === 0) {
      cartItemsEl.innerHTML = '<p class="cart-empty">سبد خرید شما خالی است.</p>';
      cartTotalEl.textContent = fmtToman(0);
      return;
    }
    let total = 0;
    cartItemsEl.innerHTML = '';
    ids.forEach(idStr => {
      const id = Number(idStr);
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      const qty = state.cart[id];
      total += p.price * qty;
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="cart-item-icon" style="background:${swatchFor(p.category)}"><span style="color:${iconColorFor(p.category)}">${iconFor(p.icon)}</span></div>
        <div class="cart-item-info">
          <div class="cart-item-name">${p.name}</div>
          <div class="cart-item-price">${fmtToman(p.price)}</div>
        </div>
        <div class="qty-controls">
          <button data-dec="${id}" aria-label="کم کردن">−</button>
          <span>${qty.toLocaleString('fa-IR')}</span>
          <button data-inc="${id}" aria-label="افزودن">+</button>
        </div>
      `;
      row.querySelector('[data-dec]').addEventListener('click', () => changeQty(id, -1));
      row.querySelector('[data-inc]').addEventListener('click', () => changeQty(id, 1));
      cartItemsEl.appendChild(row);
    });
    cartTotalEl.textContent = fmtToman(total);
  }
  function openCart() {
    cartDrawer.hidden = false;
    cartOverlay.hidden = false;
    cartBtn.setAttribute('aria-expanded', 'true');
  }
  function closeCart() {
    cartDrawer.hidden = true;
    cartOverlay.hidden = true;
    cartBtn.setAttribute('aria-expanded', 'false');
  }
  cartBtn.addEventListener('click', openCart);
  cartClose.addEventListener('click', closeCart);
  cartOverlay.addEventListener('click', closeCart);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCart(); closeModal(); } });

  /* ---------- Product modal ---------- */
  const modal = document.getElementById('productModal');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const modalBody = document.getElementById('modalBody');

  function openModal(id) {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return;
    modalBody.innerHTML = `
      <div class="modal-visual" style="background:${swatchFor(p.category)}">
        <span style="color:${iconColorFor(p.category)}">${iconFor(p.icon)}</span>
      </div>
      <div class="modal-content">
        <h2 id="modalTitle">${p.name}</h2>
        <div class="modal-cat">${p.categoryLabel} · برند ${p.brand}</div>
        <div class="modal-price">${fmtToman(p.price)}</div>
        <dl class="modal-specs">
          <div><dt>کد مدل</dt><dd>${p.model}</dd></div>
          <div><dt>${p.power != null ? 'توان مصرفی' : 'جنس'}</dt><dd>${p.power != null ? p.power.toLocaleString('fa-IR') + ' وات' : p.material}</dd></div>
          <div><dt>گارانتی</dt><dd>${p.warranty.toLocaleString('fa-IR')} ماه</dd></div>
          <div><dt>وضعیت</dt><dd>${p.inStock ? 'موجود در انبار دمو' : 'ناموجود'}</dd></div>
        </dl>
        <button class="add-btn" ${p.inStock ? '' : 'disabled'} id="modalAddBtn">${p.inStock ? 'افزودن به سبد' : 'ناموجود'}</button>
      </div>
    `;
    const addBtn = document.getElementById('modalAddBtn');
    if (addBtn) addBtn.addEventListener('click', () => { addToCart(p.id); closeModal(); });
    modal.hidden = false;
    modalOverlay.hidden = false;
  }
  function closeModal() {
    modal.hidden = true;
    modalOverlay.hidden = true;
  }
  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', closeModal);

  /* ---------- Search / sort ---------- */
  let searchTimer;
  searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = e.target.value.trim();
      renderGrid();
    }, 150);
  });
  sortSelect.addEventListener('change', (e) => {
    state.sort = e.target.value;
    renderGrid();
  });

  /* ---------- Init ---------- */
  function render() { renderGrid(); }
  renderChips();
  renderGrid();
  renderCart();
})();

</script>
</body>
</html>
