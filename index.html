<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUX HOME | فروشگاه لوازم خانگی</title>
    <!-- اتصال فونت وزیرمتن -->

    <style>
        /* ================= متغیرهای رنگی ================= */
        :root {
            --bg-black: #050505;
            --card-black: #121212;
            --gold-primary: #d4af37;
            --gold-hover: #f3e5ab;
            --text-white: #ffffff;
            --text-muted: #999999;
            --border-gold: rgba(212, 175, 55, 0.2);
        }

        /* ================= استایل‌های پایه ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
        }

        /* ================= هدر (نوار بالایی) ================= */
        header {
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-gold);
            padding: 1.2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--gold-primary);
            text-decoration: none;
            letter-spacing: 1px;
        }

        nav a {
            color: var(--text-white);
            text-decoration: none;
            margin: 0 1.5rem;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            font-size: 1rem;
        }

        nav a:hover {
            color: var(--gold-primary);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .cart-btn {
            background-color: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: bold;
        }

        .cart-btn:hover {
            background-color: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* ================= بنر اصلی (Hero) ================= */
        .hero {
            text-align: center;
            padding: 7rem 1rem;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            border-bottom: 1px solid var(--border-gold);
        }

        .hero h1 {
            font-size: 3rem;
            color: var(--gold-primary);
            margin-bottom: 1rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 1.5rem;
            font-size: 1.2rem;
        }

        /* ================= کانتینر و تیتر بخش‌ها ================= */
        .container {
            max-width: 1200px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 3rem;
            color: var(--text-white);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background-color: var(--gold-primary);
            margin: 0.8rem auto 0;
            border-radius: 2px;
        }
